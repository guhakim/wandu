<title>WANDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 네오 브루탈리즘: 두꺼운 테두리 + 하드 오프셋 그림자 + 쨍한 색 + 볼드. 홈=폴더 그리드 → 클릭 시 대화 화면. */
:root {
  --bg: #f4efe1;
  --panel: #ffffff;
  --panel-2: #faf6ea;
  --ink: #171410;
  --border: #171410;
  --muted: #6b6356;
  --accent: #ffd23f;          /* 메인 노랑 */
  --accent-strong: #f0b800;
  --accent-soft: #fff2c2;      /* 완두 말풍선 */
  --sprout: #1f7a4d;
  --me-bg: #7ed957;
  --me-ink: #10240f;
  --good: #1f8f4d;
  --warn: #d1551f;
  --sh: 5px 5px 0 var(--border);
  --sh-sm: 3px 3px 0 var(--border);
  --font-display: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1a15; --panel: #272219; --panel-2: #211d16; --ink: #f3eee0; --border: #f3eee0; --muted: #a89c86;
    --accent: #ffd23f; --accent-strong: #ffdd6a; --accent-soft: #3a3016; --sprout: #1f7a4d; --me-bg: #7ed957; --me-ink: #10240f; --good: #7fcf97; --warn: #e3a06a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1a15; --panel: #272219; --panel-2: #211d16; --ink: #f3eee0; --border: #f3eee0; --muted: #a89c86;
  --accent: #ffd23f; --accent-strong: #ffdd6a; --accent-soft: #3a3016; --sprout: #1f7a4d; --me-bg: #7ed957; --me-ink: #10240f; --good: #7fcf97; --warn: #e3a06a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* display:flex 패널이 숨겨지지 않던 문제 */
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; margin: 0; }
h1,h2,h3 { margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn { font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 11px; padding: 11px 18px; border: 3px solid var(--border); background: var(--accent); color: var(--ink); box-shadow: var(--sh-sm); display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .1s, box-shadow .1s; }
.btn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--border); }
.btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--border); }
.btn.ghost { background: var(--panel); }
.btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: var(--sh-sm); }
.iconbtn { font: inherit; font-size: 15px; font-weight: 700; background: var(--panel); border: 3px solid var(--border); color: var(--ink); cursor: pointer; padding: 7px 12px; border-radius: 10px; box-shadow: var(--sh-sm); }
.iconbtn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--border); }
.iconbtn .ico { width: 19px; height: 19px; display: block; }
#manage-btn.active { background: var(--warn); color: #fff; }

.wrap { max-width: 1440px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 44px) 48px; min-height: 100%; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 18px; }
.logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.logo .badge { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: var(--accent); border: 3px solid var(--border); border-radius: 11px; box-shadow: var(--sh-sm); }
.logo .badge svg { width: 30px; height: 30px; }
.logo b { font-family: var(--font-display); font-size: 26px; letter-spacing: .03em; }

/* ===== 홈: 폴더 그리드 ===== */
.home-head { display: flex; align-items: center; gap: 12px; margin: 6px 2px 20px; }
.nick { text-decoration: underline dotted; text-underline-offset: 4px; cursor: pointer; }
.nick:hover { background: var(--accent-soft); border-radius: 6px; }
/* 헤더 버튼 3종(연필·＋·휴지통) 크기·모양 통일 */
.add-btn, .nick-btn, #manage-btn {
  width: 38px; height: 38px; flex: none; padding: 0;
  display: grid; place-items: center; cursor: pointer;
  border: 3px solid var(--border); border-radius: 11px;
  box-shadow: var(--sh-sm); transition: transform .1s, box-shadow .1s;
}
.nick-btn, #manage-btn { background: var(--panel); color: var(--ink); }
.nick-btn svg, #manage-btn .ico { width: 18px; height: 18px; display: block; }
.add-btn:hover, .nick-btn:hover, #manage-btn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--border); }
.add-btn:active, .nick-btn:active, #manage-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--border); }
.nick-input { font: inherit; font-family: var(--font-display); font-size: 1em; width: 14em; max-width: 58vw; border: 2.5px solid var(--border); border-radius: 8px; padding: 1px 7px; background: var(--panel); color: var(--ink); }
.home-head h2 { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; }
.add-btn { background: var(--accent); color: var(--ink); font-family: var(--font-display); font-size: 23px; line-height: 1; }
.folders { display: grid; grid-template-columns: repeat(3, 1fr); align-items: start; gap: 30px 26px; }
@media (max-width: 920px) { .folders { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .folders { grid-template-columns: 1fr; gap: 24px 16px; } }
.folder { position: relative; margin-top: 19px; background: var(--f-fill, var(--panel)); border: 3px solid var(--border); border-radius: 5px 16px 16px 16px; box-shadow: var(--sh); padding: 20px; cursor: pointer; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 14px; min-height: 196px; transition: transform .1s, box-shadow .1s; }
.folder::before { content: ""; position: absolute; top: -19px; left: 18px; width: 96px; height: 20px; background: var(--c, var(--accent)); border: 3px solid var(--border); border-bottom: none; border-radius: 11px 11px 0 0; }
.folder:hover { transform: translate(2px,2px); box-shadow: 3px 3px 0 var(--border); }
.folder .f-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.folder .f-icon { width: 60px; height: 60px; display: grid; place-items: center; background: var(--c, var(--accent)); border: 3px solid var(--border); border-radius: 13px; }
.folder .f-icon svg { width: 32px; height: 32px; color: var(--border); }
.folder .f-badge { font-size: 12px; font-weight: 700; background: var(--panel); border: 2.5px solid var(--border); border-radius: 99px; padding: 3px 11px; white-space: nowrap; }
.del-btn { position: absolute; top: 12px; right: 12px; display: none; align-items: center; background: var(--panel); color: var(--warn); border: 2.5px solid var(--border); border-radius: 99px; padding: 3px 11px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0 var(--border); z-index: 2; }
.folders.manage .del-btn { display: inline-flex; }
.folders.manage .f-badge { display: none; }
.folders.manage .folder { cursor: default; }
.del-btn.armed { background: var(--warn); color: #fff; }
/* 휴지통: 정리 모드에서만 폴더 아래에 보임 */
.trash { margin-top: 36px; border: 3px dashed var(--border); border-radius: 16px; padding: 18px 20px; background: var(--panel-2); }
.trash-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.trash-head h3 { margin: 0; font-size: 18px; }
.trash-head .t-empty { margin-left: auto; }
.trash-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px solid color-mix(in srgb, var(--border) 15%, transparent); }
.trash-row .t-name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trash-row .t-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.t-btn { background: var(--panel); color: var(--ink); border: 2.5px solid var(--border); border-radius: 99px; padding: 3px 11px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0 var(--border); white-space: nowrap; }
.t-btn.warn { color: var(--warn); }
.t-btn.armed { background: var(--warn); color: #fff; }
.t-btn:hover { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--border); }
.trash-none { color: var(--muted); font-size: 14px; padding: 4px 0; }
.del-btn:hover { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--border); }
.folder .f-label { font-weight: 700; font-size: 19px; line-height: 1.4; padding-bottom: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.folder .f-sub { font-size: 13.5px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.folder.new { align-items: center; justify-content: center; gap: 6px; --f-fill: var(--accent-soft); }
.folder.new .plus { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.folder.new .nl { font-weight: 700; }
.folder .pill { font-size: 10.5px; font-weight: 700; border: 2px solid var(--border); border-radius: 99px; padding: 0 7px; background: var(--panel); }
.folder .pill.y { background: var(--me-bg); color: var(--me-ink); }

/* ===== 세션 ===== */
#session { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100dvh - 96px); }
.sess-top { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.sess-top .bk { min-width: 0; }
.sess-top .bk b { font-family: var(--font-display); font-size: 21px; display: block; line-height: 1.45; padding-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .02em; }
.sess-top .bk span { font-size: 12px; color: var(--muted); }
.convo { display: flex; flex-direction: column; gap: 14px; padding: 2px 0 16px; flex: 1 1 auto; min-height: 0; }
.hcard { background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; box-shadow: var(--sh-sm); }
.hcard b { color: var(--ink); font-size: 16px; font-family: var(--font-display); letter-spacing: .02em; }
.keep { font-size: 12px; color: var(--muted); }
.keep::before { content: "✓ "; color: var(--good); font-weight: 700; }
.msg { display: flex; flex-direction: column; max-width: 86%; gap: 4px; }
.msg.ai { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.who { font-size: 15px; font-weight: 700; color: var(--muted); padding: 0 4px; display: flex; align-items: center; gap: 8px; }
.who .badge { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); border: 3px solid var(--border); border-radius: 8px; }
.who .badge svg { width: 23px; height: 23px; } /* 로고처럼 사각형 안을 완두콩이 채우게 */
.bubble { padding: 12px 16px; border: 3px solid var(--border); border-radius: 14px; white-space: pre-wrap; word-break: break-word; box-shadow: var(--sh-sm); }
.ai .bubble { background: var(--accent-soft); border-top-left-radius: 4px; }
.ai .bubble.q { font-weight: 600; font-size: 16px; line-height: 1.55; }
.me .bubble { background: var(--me-bg); color: var(--me-ink); border-top-right-radius: 4px; font-weight: 500; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 1px; border-radius: 50%; background: var(--border); animation: blink 1.2s infinite both; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-3px)} }
@media (prefers-reduced-motion: reduce){ .typing span{animation:none} .btn,.folder{transition:none} }

/* 입력 독 */
.dock { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 78%, transparent); padding: 12px 0 calc(10px + env(safe-area-inset-bottom,0px)); }
.panel { background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--sh); }
.setup-top { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.setup-top .cover-pick { align-self: flex-start; }
.cover-pick { flex: none; width: 76px; height: 100px; border: 2.5px dashed var(--border); border-radius: 10px; background: var(--panel-2); cursor: pointer; display: grid; place-items: center; overflow: hidden; padding: 0; color: var(--muted); font: inherit; font-size: 11px; font-weight: 700; text-align: center; line-height: 1.3; }
.cover-pick:hover { border-color: var(--accent-strong); }
.cover-pick img { width: 100%; height: 100%; object-fit: cover; }
.f-icon.cover { padding: 0; overflow: hidden; background: var(--panel); }
.f-icon.cover img { width: 100%; height: 100%; object-fit: cover; }
.dock.collapsed > .panel { display: none !important; }
.reopen { width: 100%; font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--ink); border: 3px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: var(--sh-sm); transition: transform .1s, box-shadow .1s; }
.reopen:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--border); }
.convo { cursor: default; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
label .hint { font-weight: 400; color: var(--muted); }
input[type=text], input[type=number], textarea { font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--panel-2); border: 2.5px solid var(--border); border-radius: 10px; padding: 11px 13px; width: 100%; }
input:focus, textarea:focus { box-shadow: var(--sh-sm); }
textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px){ .two { grid-template-columns: 1fr; } }
.two > *, .row2 > * { min-width: 0; }
.row2 { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
@media (max-width: 480px){ .row2 { grid-template-columns: 1fr; } }
.acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.acts.spread { justify-content: space-between; }
.sub-acts { display: flex; gap: 8px; }
.btn.sm { padding: 8px 13px; font-size: 13px; box-shadow: 2px 2px 0 var(--border); }
.btn.sm:hover { box-shadow: 1px 1px 0 var(--border); }
.err { color: var(--warn); font-size: 13px; font-weight: 600; margin-right: auto; }
.result { background: var(--accent-soft); border: 3px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 500; }
.result b { color: var(--good); font-weight: 800; }
.iconbtn:disabled { opacity: .45; cursor: default; }
</style>

<svg width="0" height="0" style="position:absolute"><symbol id="mark" viewBox="0 0 24 24"><path d="M12 21v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 14c0-3 2-4 5-4 0 3-2 4-5 4Z" fill="currentColor" opacity=".82"/><path d="M12 15c0-3-2-4.5-5-4.5 0 3 2 4.5 5 4.5Z" fill="currentColor"/></symbol>
<symbol id="pea-face" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#b8d04a"/><path d="M8 8.6l3.2 1.8L8 12.2M24 8.6l-3.2 1.8L24 12.2" fill="none" stroke="#171410" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.4 12.6q1.6 1.8 3.2 0" fill="none" stroke="#4f7a1f" stroke-width="1.4" stroke-linecap="round"/><circle cx="6.6" cy="12.8" r="1.6" fill="#f2d84b"/><circle cx="25.4" cy="13.6" r="1.6" fill="#f2d84b"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5 17h13" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.5 7l.9 12a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9l.9-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.12 2.12 0 0 0-3-3L5 17v3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14.5 6.5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol></svg>

<div class="wrap">
  <div class="topbar">
    <div class="logo" id="logo"><span class="badge"><svg><use href="#pea-face"/></svg></span><b>WANDU</b></div>
    <button class="iconbtn" id="back-btn" type="button" hidden>← 폴더</button>
  </div>

  <!-- ===== 홈: 폴더 ===== -->
  <section id="home">
    <div class="home-head">
      <h2 id="home-head-h2">나의 과거대화</h2>
      <button class="nick-btn" id="nick-btn" type="button" aria-label="제목 수정"><svg><use href="#pencil"/></svg></button>
      <button class="add-btn" id="add-folder" type="button" aria-label="새 폴더 추가">＋</button>
      <button class="iconbtn" id="manage-btn" type="button" style="margin-left:auto" aria-label="폴더 정리"><svg class="ico"><use href="#trash"/></svg></button>
    </div>
    <div class="folders" id="folders"></div>
    <div class="trash" id="trash-bin" hidden></div>
  </section>

  <!-- ===== 세션 ===== -->
  <section id="session" hidden>
    <div class="sess-top"><div class="bk"><b id="sess-book"></b><span id="sess-sub"></span></div></div>
    <div class="convo" id="convo"></div>
    <div class="dock" id="dock">
      <button class="reopen" id="reopen" type="button" hidden>✎ 입력 열기</button>
      <div class="panel" id="p-setup" hidden>
        <div class="setup-top">
          <button type="button" class="cover-pick" id="cover-pick" aria-label="표지 이미지 추가">
            <img id="cover-preview" alt="" hidden>
            <span id="cover-ph">＋<br>표지</span>
          </button>
          <label for="i-book" style="flex:1;min-width:0">무슨 책 읽어요? <span class="hint">제목</span>
            <input type="text" id="i-book" placeholder="예: 노인과 바다" autocomplete="off"></label>
        </div>
        <input type="file" id="cover-input" accept="image/*" hidden>
        <p class="hint" id="cover-status" hidden style="margin-top:-2px"></p>
        <div class="two">
          <label for="i-author">저자 <span class="hint">선택</span>
            <input type="text" id="i-author" placeholder="예: 헤밍웨이" autocomplete="off"></label>
          <label for="i-reason">읽는 이유 <span class="hint">선택 · 한 줄</span>
            <input type="text" id="i-reason" placeholder="예: 끝까지 읽어보고 싶어서" autocomplete="off"></label>
        </div>
        <p class="keep">AI는 책 원문이 아니라, 당신이 적는 메모만 보고 이야기해요.</p>
        <div class="acts"><span class="err" id="e-setup" hidden></span><button class="btn" id="b-setup" type="button">읽기 시작</button></div>
      </div>
      <div class="panel" id="p-memo" hidden>
        <div class="row2">
          <label for="i-page">지금 몇 쪽?
            <input type="number" id="i-page" inputmode="numeric" min="0" placeholder="예: 12"></label>
          <label for="i-memo">읽은 부분 메모 <span class="hint">기억나는 문장 메모해 주세요</span>
            <textarea id="i-memo" placeholder="예: 노인이 85일째 물고기를 못 잡았다. 소년이 노인을 챙긴다."></textarea></label>
        </div>
        <div class="acts spread"><button class="btn ghost sm" id="b-memo-back" type="button">← 이전</button><span class="err" id="e-memo" hidden></span><button class="btn" id="b-memo" type="button">완두에게 보여주기</button></div>
      </div>
      <div class="panel" id="p-answer" hidden>
        <textarea id="i-answer" placeholder="완두에게 계속 이야기해요"></textarea>
        <div class="acts spread">
          <div class="sub-acts">
            <button class="btn ghost sm" id="b-more" type="button">＋ 메모</button>
            <button class="btn ghost sm" id="b-finish" type="button">마치기</button>
          </div>
          <button class="btn" id="b-answer" type="button">보내기</button>
        </div>
      </div>
      <div class="panel" id="p-done" hidden>
        <div class="result" id="done-result"></div>
        <div class="acts spread">
          <button class="btn ghost" id="b-tohome" type="button">폴더로</button>
          <button class="btn" id="b-continue" type="button">이어서 더 읽기</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MARK = '<svg><use href="#pea-face"/></svg>'; // 채팅 '완두' 아이콘: 완두콩 얼굴
  const COLORS = ["#ffd23f", "#7ed957", "#4da3ff", "#ff8fab", "#b893ff", "#ff9f45", "#5ad1c4"];
  // ---- AI가 안 될 때: 메모 속 단어·책 정보로 질문·답장 만들기 ----
  // 키워드는 "명사+조사" 형태(싱클레어가, 습관은)나 두 번 이상 나온 한글 단어만 믿는다. 동사·부사가 섞이는 걸 막기 위함.
  const JOSA_TAIL = /(에서는|에서|에게|한테|으로|부터|까지|처럼|보다|이랑|은|는|을|를|와|과|의|에|도|만|가|이)$/;
  const STOP = new Set(["그리고", "그래서", "하지만", "그런데", "근데", "너무", "정말", "진짜", "오늘", "이번", "조금", "약간", "계속", "다시", "그냥", "가장", "제일",
    "부분", "내용", "생각", "느낌", "이야기", "그것", "이것", "저것", "우리", "자기", "자신", "사람", "지금", "이제", "다음", "처음", "마지막", "하나", "모두", "모든",
    "정도", "때문", "이유", "장면", "문장", "그거", "이거", "무엇", "누구", "어디", "언제", "책", "저자", "작가", "주인공"]);
  const isHangul = (w) => /^[가-힣]+$/.test(w);
  const hasBatchim = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
  const Q = (w, pair) => "'" + w + "'" + (pair ? (hasBatchim(w) ? pair[0] : pair[1]) : "");
  const hangulLen = (t) => (t.match(/[가-힣]/g) || []).length; // 숫자·영어·이모지·ㅋㅋ는 안 셈
  function keywords(text) {
    const score = new Map(), raws = new Map();
    (text || "").split(/[\s.,!?…"'“”‘’()\[\]·~\-:;/「」『』]+/).forEach((raw, i) => {
      if (!isHangul(raw)) return;
      raws.set(raw, (raws.get(raw) || 0) + 1);
      const m = raw.match(JOSA_TAIL);
      if (!m) return;
      let stem = raw.slice(0, -m[1].length);
      const m2 = stem.match(JOSA_TAIL); // 때에는·집에서도처럼 조사가 겹친 경우
      if (m2 && m2[1] !== "이" && m2[1] !== "가") { // 고양이가 → 고양이 (이·가는 명사 끝일 수 있어 두 번째엔 안 뗌)
        if (stem.length - m2[1].length < 2) return;
        stem = stem.slice(0, -m2[1].length);
      }
      // '이'만 붙은 3글자 이하(고양이·어린이)는 명사 자체일 수 있어 자르지 않음
      if (m[1] === "이" && raw.length <= 3) return;
      if (stem.length < 2 || stem.length > 8 || STOP.has(stem)) return;
      const c = score.get(stem) || { n: 0, first: i }; c.n += 2; score.set(stem, c);
    });
    raws.forEach((n, w) => { // 조사 없이 두 번 이상 나온 단어(이름 등)
      if (n < 2 || w.length < 2 || STOP.has(w) || /[다요죠네]$/.test(w)) return;
      const c = score.get(w) || { n: 0, first: 999 }; c.n += n; score.set(w, c);
    });
    return [...score.entries()].sort((a, b) => b[1].n - a[1].n || a[1].first - b[1].first).map(e => e[0]);
  }
  const usedBefore = (s, w) => s.turns.some(t => t.kind === "q" && t.text.includes("'" + w + "'"));
  function localQuestions(s, memo) {
    const all = keywords(memo);
    const kw = all.filter(w => !usedBefore(s, w)).concat(all.filter(w => usedBefore(s, w))); // 지난 회차에 물은 단어는 뒤로
    const [k1, k2, k3] = kw;
    const book = "『" + s.book + "』";
    const r = s.rounds || 0; const pick = (arr, off) => arr[(r + off) % arr.length];
    const snippet = memo.replace(/\s+/g, " ").slice(0, 16) + (memo.length > 16 ? "…" : "");
    const quoted = /^["“'‘「]/.test(memo.trim());
    const reason = s.reason ? s.reason.slice(0, 18) + (s.reason.length > 18 ? "…" : "") : "";
    const q1 = quoted ? "옮겨 적은 그 문장, 어떤 점에서 마음에 걸렸어요?"
      : k1 ? pick(["메모에 쓴 " + Q(k1) + ", 책에서는 어떤 대목이었어요?",
                   Q(k1, "이가") + " 나온 부분에서 밑줄 긋고 싶은 문장이 있었어요?",
                   Q(k1) + "에 대해 책에 나온 표현을 한 줄 옮겨 볼래요?"], 0)
      : "'" + snippet + "'라고 적었는데, 어느 대목이 그랬는지 조금 더 말해 줄래요?";
    const t2 = k2 || k1;
    const q2 = reason
      ? (t2 ? pick(["'" + reason + "'라고 했죠. " + Q(t2, "은는") + " 그 기대와 맞았나요?",
                    "읽는 이유가 '" + reason + "'였죠. " + Q(t2, "이가") + " 거기에 어떤 도움이 됐어요?"], 1)
            : "'" + reason + "'라고 했죠. 오늘 읽은 부분은 그 기대와 맞았나요?")
      : t2 ? pick([Q(t2) + "에 대한 내 생각은 책과 같아요, 달라요?",
                   Q(t2, "을를") + " 읽으며 떠오른 내 경험이 있나요?",
                   Q(t2, "이가") + " 왜 메모할 만큼 중요했어요?"], 1)
      : "오늘 읽은 부분에서 나라면 다르게 생각했을 대목이 있나요?";
    const t3 = k3 || (k2 && k2 !== t2 ? k2 : null);
    const q3 = t3 ? pick(["다음 부분에서 " + Q(t3, "은는") + " 어떻게 이어질 것 같아요?",
                          Q(t3) + "에 대해 책이 아직 말하지 않은 것, 궁금한 게 있나요?"], 2)
      : pick([book + " 다음 쪽을 펼치기 전, 가장 궁금한 건 뭐예요?",
              book + "에서 다음 부분을 읽으며 확인하고 싶은 게 있나요?"], 2);
    return [q1, q2, q3];
  }
  // 답장: 남은 질문을 잇고, 다 다루면 '더 읽기 → 마치기'로 이끈다. 짧은 답이 이어지면 다그치지 않고 읽기로 돌려보냄.
  function localReply(s, answer) {
    const lastQ = s.turns.map(t => t.kind).lastIndexOf("q");
    const mine = s.turns.slice(lastQ + 1).filter(t => t.role === "me");
    const isShort = (t) => hangulLen(t) < 6;
    const n = mine.filter(t => !isShort(t.text)).length; // 이번 질문 뒤 제대로 된 답 수
    let streak = 0; for (let i = mine.length - 1; i >= 0 && isShort(mine[i].text); i--) streak++;
    const qs = s.questions || []; const next = qs[n];
    const read = s.page != null ? Math.max(0, s.page - (s.prevPage || 0)) : null;
    const goal = s.page == null ? "몇 쪽 더 읽고"
      : read < 4 ? "고비까지 " + (4 - read) + "쪽만 더 읽고"
      : (s.page + 5) + "쪽까지만 더 읽고";
    const MORE = "‘＋ 메모’", DONE = "‘마치기’";
    if (streak === 1) {
      const cur = qs[n];
      return cur ? "한 문장만 더 붙여 줄래요? 어려우면 떠오르는 단어 하나만 적어도 돼요 ✏️\n(" + (n + 1) + "번: " + cur + ")"
                 : "한 문장만 더 붙여 줄래요? 어려우면 떠오르는 단어 하나만 적어도 돼요 ✏️";
    }
    if (streak >= 2) return [
      "괜찮아요, 말로 풀기 어려울 땐 읽는 게 답이에요. " + goal + " " + MORE + "로 이어 가요 📖",
      "오늘은 여기까지도 충분해요. 쉬고 싶으면 " + DONE + ", 조금 더 읽을 힘이 있으면 " + MORE + "를 눌러 주세요 🌱"
    ][(streak - 2) % 2];
    const known = (s.memo || "") + " " + qs.join(" "); // 메모·질문에 나온 단어만 짚음(동사 오인 방지)
    const kw = keywords(answer).find(w => known.includes(w));
    const opener = kw ? [Q(kw, "을를") + " 짚으셨네요. ", Q(kw) + " 이야기, 좋은 포인트예요. ", Q(kw) + "에 주목하셨군요. "][n % 3]
                      : ["그렇게 읽으셨군요. ", "좋은 답이에요. ", "잘 정리하셨어요. "][n % 3];
    if (next) return opener + "그럼 " + (n + 1) + "번도 이어서 —\n" + next;
    const k = n - qs.length;
    const steps = [
      opener + "질문 세 개를 다 나눴어요 👏 지금 생각이 다음 부분에서 바뀌는지 보는 것도 재밌어요. " + goal + " " + MORE + "로 적어 볼까요? 📖",
      "책 덮기 전에 한 줄만 더: 오늘 읽은 부분을 친구에게 한 문장으로 소개한다면? 다 쓰면 " + DONE + "로 마무리해요.",
      "오늘 대화로 읽은 내용이 꽤 정리됐어요. 더 읽을 힘이 남았으면 " + MORE + ", 오늘은 여기까지면 " + DONE + "를 눌러 주세요 🌱"
    ];
    return k < steps.length ? steps[k] : steps[1 + (k % 2)];
  }
  const SKEY = "wandu-sessions";
  const TKEY = "wandu-trash"; // 삭제한 폴더는 여기로 옮겨졌다가 휴지통에서 영구 삭제
  const esc = (t) => { const d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; };
  const colorOf = (id) => { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; };

  // ---- 저장소 ----
  const loadAll = () => { try { return JSON.parse(localStorage.getItem(SKEY) || "[]"); } catch (e) { return []; } };
  const saveAll = (arr) => { try { localStorage.setItem(SKEY, JSON.stringify(arr.slice(0, 200))); } catch (e) {} };
  const loadTrash = () => { try { return JSON.parse(localStorage.getItem(TKEY) || "[]"); } catch (e) { return []; } };
  const saveTrash = (arr) => { try { localStorage.setItem(TKEY, JSON.stringify(arr.slice(0, 100))); } catch (e) {} };
  function moveToTrash(id) {
    const all = loadAll(); const rec = all.find(r => r.id === id); if (!rec) return;
    saveAll(all.filter(r => r.id !== id));
    saveTrash([Object.assign({}, rec, { deletedAt: Date.now() })].concat(loadTrash().filter(r => r.id !== id)));
  }
  function restoreFromTrash(id) {
    const tr = loadTrash(); const rec = tr.find(r => r.id === id); if (!rec) return;
    saveTrash(tr.filter(r => r.id !== id));
    delete rec.deletedAt; saveAll([rec].concat(loadAll().filter(r => r.id !== id)));
  }
  function upsert(s) {
    const all = loadAll(); const rec = snapshot(s); const i = all.findIndex(x => x.id === s.id);
    if (i >= 0) all[i] = rec; else all.unshift(rec);
    all.sort((a, b) => b.at - a.at); saveAll(all); renderFolders();
  }
  function snapshot(s) {
    const pages = s.page != null ? Math.max(0, s.page - (s.prevPage || 0)) : null;
    return { id: s.id, at: s.at || Date.now(), date: new Date(s.at || Date.now()).toLocaleDateString("ko-KR", { month: "long", day: "numeric" }),
      book: s.book, author: s.author, reason: s.reason, cover: s.cover || "", prevPage: s.prevPage || 0, page: s.page, pages,
      summary: s.summary || "", turns: s.turns.slice(), rounds: s.rounds || 0,
      mode: s.mode, questions: s.questions || [], memo: s.memo || "", done: !!s.done };
  }

  let S = null;
  function freshSession(opts) {
    return Object.assign({ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      at: Date.now(), mode: "setup", book: "", author: "", reason: "", cover: "", prevPage: 0, page: null, memo: "",
      questions: [], turns: [], summary: "", rounds: 0, done: false, readonly: false }, opts || {});
  }

  // ---- 홈: 폴더 그리드 ----
  function renderFolders() {
    const box = $("folders"); box.textContent = "";
    const all = loadAll();
    if (!all.length) { const e = document.createElement("div"); e.style.cssText = "grid-column:1/-1;color:var(--muted);padding:30px 4px;font-size:14px"; e.textContent = "위의 ＋ 를 눌러 첫 폴더를 만들어 보세요 🌱"; box.appendChild(e); }
    all.forEach(s => {
      const c = colorOf(s.id);
      const empty = !s.turns || s.turns.length === 0;
      const reached = typeof s.page === "number" ? s.page : null;
      const pass = typeof s.pages === "number" ? s.pages >= 4 : null;
      const f = document.createElement("button"); f.type = "button"; f.className = "folder";
      f.style.setProperty("--c", c); f.style.setProperty("--f-fill", "color-mix(in srgb, " + c + " 16%, var(--panel))");
      const badge = reached != null ? reached + "쪽" : empty ? "NEW" : (s.rounds || 1) + "번";
      const iconHTML = s.cover
        ? '<span class="f-icon cover"><img src="' + s.cover + '" alt=""></span>'
        : '<span class="f-icon"><svg><use href="#book"/></svg></span>';
      f.innerHTML =
        '<div class="f-top">' + iconHTML +
          '<span class="f-badge">' + badge + '</span></div>' +
        '<div class="f-label">' + (s.book ? "『" + esc(s.book) + "』" : "새 대화") + '</div>' +
        '<div class="f-sub">' + esc(s.summary || (s.turns && (s.turns.find(t => t.role === "me") || {}).text) || "눌러서 시작하기") + '</div>' +
        '<div style="display:flex;gap:6px;align-items:center;margin-top:auto"><span class="f-sub" style="margin:0">' + esc(s.date || "") + '</span>' +
        (pass === true ? '<span class="pill y">통과</span>' : pass === false ? '<span class="pill">미통과</span>' : '') + '</div>';
      f.addEventListener("click", () => { if (manageMode) return; openFolder(s); });
      const del = document.createElement("span"); del.className = "del-btn"; del.textContent = "삭제";
      del.addEventListener("click", (ev) => { ev.stopPropagation(); moveToTrash(s.id); renderFolders(); });
      f.appendChild(del);
      box.appendChild(f);
    });
    renderTrash();
  }

  // ---- 휴지통 (정리 모드에서만 보임) ----
  // 되돌릴 수 없는 버튼은 두 번 눌러야 실행
  function armBtn(btn, label, run) {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("armed")) { run(); return; }
      btn.classList.add("armed"); btn.textContent = "정말?";
      setTimeout(() => { btn.classList.remove("armed"); btn.textContent = label; }, 3000);
    });
  }
  function renderTrash() {
    const box = $("trash-bin"); box.hidden = !manageMode; if (!manageMode) return;
    const tr = loadTrash(); box.textContent = "";
    const head = document.createElement("div"); head.className = "trash-head";
    head.innerHTML = "<h3>휴지통 (" + tr.length + ")</h3>";
    if (tr.length) {
      const empty = document.createElement("button"); empty.type = "button"; empty.className = "t-btn warn t-empty"; empty.textContent = "비우기";
      armBtn(empty, "비우기", () => { saveTrash([]); renderTrash(); });
      head.appendChild(empty);
    }
    box.appendChild(head);
    if (!tr.length) { const n = document.createElement("div"); n.className = "trash-none"; n.textContent = "비어 있어요. 폴더의 ‘삭제’를 누르면 여기로 옮겨져요."; box.appendChild(n); return; }
    tr.forEach(r => {
      const row = document.createElement("div"); row.className = "trash-row";
      const d = new Date(r.deletedAt || Date.now());
      row.innerHTML = '<span class="t-name">' + (r.book ? "『" + esc(r.book) + "』" : "새 대화") + '</span>' +
        '<span class="t-date">' + (d.getMonth() + 1) + "월 " + d.getDate() + "일 삭제</span>";
      const back = document.createElement("button"); back.type = "button"; back.className = "t-btn"; back.textContent = "복원";
      back.addEventListener("click", () => { restoreFromTrash(r.id); renderFolders(); });
      const kill = document.createElement("button"); kill.type = "button"; kill.className = "t-btn warn"; kill.textContent = "영구 삭제";
      armBtn(kill, "영구 삭제", () => { saveTrash(loadTrash().filter(x => x.id !== r.id)); renderTrash(); });
      row.appendChild(back); row.appendChild(kill); box.appendChild(row);
    });
  }

  // ---- 화면 전환 ----
  function showHome() { $("home").hidden = false; $("session").hidden = true; $("back-btn").hidden = true; renderFolders(); }
  function openSession() { $("home").hidden = true; $("session").hidden = false; $("back-btn").hidden = false; renderTop(); renderConvo(); setMode(S.mode); }
  function renderTop() {
    $("sess-book").textContent = S.book ? "『" + S.book + "』" : "새 대화";
    const bits = []; if (S.author) bits.push(S.author); if (S.page != null) bits.push((S.prevPage || 0) + "→" + S.page + "쪽");
    $("sess-sub").textContent = bits.join(" · ");
  }
  let pendingTyping = false;
  function renderConvo() {
    const box = $("convo"); box.textContent = "";
    if (S.book) {
      const h = document.createElement("div"); h.className = "hcard";
      h.innerHTML = "<b>『" + esc(S.book) + "』" + (S.author ? " · " + esc(S.author) : "") + "</b>" +
        (S.reason ? "<span>읽는 이유: " + esc(S.reason) + "</span>" : "") +
        '<span class="keep">AI는 내 메모만 보고 질문 · 책 원문은 넣지 않음</span>';
      box.appendChild(h);
    }
    S.turns.forEach(t => box.appendChild(bubble(t)));
    if (pendingTyping) box.appendChild(typingEl());
    requestAnimationFrame(() => { const last = box.lastElementChild; last && last.scrollIntoView({ block: "end" }); });
  }
  function bubble(t) {
    const w = document.createElement("div"); w.className = "msg " + t.role;
    if (t.role === "ai") { const who = document.createElement("div"); who.className = "who"; who.innerHTML = '<span class="badge">' + MARK + '</span><span>완두</span>'; w.appendChild(who); }
    const b = document.createElement("div"); b.className = "bubble" + (t.kind === "q" ? " q" : ""); b.textContent = t.text; w.appendChild(b); return w;
  }
  function typingEl() {
    const w = document.createElement("div"); w.className = "msg ai";
    const who = document.createElement("div"); who.className = "who"; who.innerHTML = '<span class="badge">' + MARK + '</span><span>완두</span>'; w.appendChild(who);
    const b = document.createElement("div"); b.className = "bubble typing"; b.innerHTML = "<span></span><span></span><span></span>"; w.appendChild(b); return w;
  }
  function setTyping(on) {
    pendingTyping = on; renderConvo();
    $("back-btn").disabled = on; $("logo").style.pointerEvents = on ? "none" : ""; // 응답 대기 중엔 폴더 이동 막기
  }
  function pushTurn(role, text, kind) { S.turns.push({ role, text, kind: kind || "" }); renderConvo(); }

  const PANELS = ["p-setup", "p-memo", "p-answer", "p-done"];
  function setMode(m) {
    S.mode = m; PANELS.forEach(p => $(p).hidden = true);
    if (S.readonly) { $("p-done").hidden = false; expandDock(); renderDonePanel(true); return; }
    const map = { setup: "p-setup", memo: "p-memo", answer: "p-answer", done: "p-done" };
    if (map[m]) $(map[m]).hidden = false;
    // 채팅(answer)은 기본으로 접어두고 대화를 보여줌 → 대화창을 누르면 입력이 올라옴
    if (m === "answer") collapseDock(); else expandDock();
    if (m === "memo") { $("i-memo").value = ""; $("i-page").value = (S.page != null ? S.page : ""); setTimeout(() => $("i-page").focus(), 50); }
  }

  // ＋ : 빈 폴더만 생성하고 홈에 머무름
  function createFolder() {
    const s = freshSession(); upsert(s);
    requestAnimationFrame(() => { const first = $("folders").children[0]; if (first) first.animate ? first.animate([{ transform: "scale(.9)" }, { transform: "scale(1)" }], { duration: 160 }) : null; });
  }
  // 폴더 열기: 비었으면 입력부터, 내용 있으면 지난 대화 보기
  function openFolder(rec) {
    const empty = !rec.turns || rec.turns.length === 0;
    if (empty) {
      S = freshSession(Object.assign({}, rec, { readonly: false, mode: "setup" })); S.turns = [];
      $("i-book").value = rec.book || ""; $("i-author").value = rec.author || ""; $("i-reason").value = rec.reason || "";
      openSession(); setMode("setup"); syncCover(); setTimeout(() => $("i-book").focus(), 60);
    } else if (rec.done) {
      openDetail(rec);
    } else { // 진행 중이던 폴더 — 이어하기
      S = freshSession(Object.assign({}, rec, { readonly: false })); S.turns = (rec.turns || []).slice();
      openSession(); setMode(rec.mode === "memo" ? "memo" : "answer");
    }
  }
  function startNew() { S = freshSession(); $("i-book").value = ""; $("i-author").value = ""; $("i-reason").value = ""; openSession(); setMode("setup"); syncCover(); setTimeout(() => $("i-book").focus(), 60); }
  function openDetail(rec) { S = freshSession(Object.assign({}, rec, { readonly: true, mode: "done" })); S.turns = (rec.turns || []).slice(); openSession(); }
  // 이어 읽기: 같은 폴더에 계속 쌓음 (새 폴더 만들지 않음)
  function continueFrom() {
    S.readonly = false; S.prevPage = S.page || 0; S.memo = ""; S.questions = []; S.done = false;
    pushTurn("ai", "다시 이어서 읽어요 🌱 조금 읽고 와서 새 메모를 남겨 주세요.");
    openSession(); setMode("memo"); upsert(S);
  }

  // ---- AI (메모·답만 근거) ----
  let samplePromise = null;
  const getSample = () => (samplePromise = samplePromise || (window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null)));
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms || 18000))]);
  const RULES = "너는 '완두'라는 다정한 독서 토론 친구다. 한국어, 부드러운 존댓말, 이모지는 많아야 하나. 깊이 있게 이야기하되 정직하라. " +
    "절대 규칙: ① 책의 구체적 장면·대사·인물 행동은 사용자가 적은 것만 근거로 삼고 지어내지 마라. ② 사용자가 읽은 쪽 이후의 줄거리·결말은 절대 말하지 마라(스포일러 금지). " +
    "③ 작가·시대 배경이나 널리 알려진 개념·사상처럼 확실한 일반 지식은 '알려진 바로는'처럼 밝히고 한 문장 이내로 덧붙여도 된다. 확실하지 않으면 말하지 마라.";
  // 지난 회차 메모(질문 바로 앞 turn) — AI가 회차를 엮어 이야기하도록
  function pastMemos(s, skipLast) {
    const out = [];
    s.turns.forEach((t, i) => { const nx = s.turns[i + 1]; if (t.role === "me" && nx && nx.kind === "q") out.push(t.text.slice(0, 100)); });
    if (skipLast) out.pop();
    return out.slice(-3).join("\n- ");
  }

  // ---- 표지 이미지 ----
  function syncCover() {
    const img = $("cover-preview"), ph = $("cover-ph");
    if (S && S.cover) { img.src = S.cover; img.hidden = false; ph.hidden = true; }
    else { img.removeAttribute("src"); img.hidden = true; ph.hidden = false; }
    coverStatus("");
  }
  function resizeImage(file, max) {
    return new Promise((res) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url);
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const cw = Math.max(1, Math.round(img.width * sc)), ch = Math.max(1, Math.round(img.height * sc));
        const c = document.createElement("canvas"); c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        try { res(c.toDataURL("image/jpeg", 0.82)); } catch (e) { res(null); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }
  function resizeToBlob(file, max) {
    return new Promise((res) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url);
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const cw = Math.max(1, Math.round(img.width * sc)), ch = Math.max(1, Math.round(img.height * sc));
        const c = document.createElement("canvas"); c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        c.toBlob((b) => res(b), "image/jpeg", 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }
  function coverStatus(msg) { const el = $("cover-status"); if (!el) return; el.textContent = msg || ""; el.hidden = !msg; }

  $("cover-pick").addEventListener("click", () => $("cover-input").click());
  $("cover-input").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file || !S) return;
    const data = await resizeImage(file, 400);
    if (data) { S.cover = data; syncCover(); }
    // 표지 글자 읽어 제목·저자 자동 채우기 (비전 가능할 때만)
    const sample = await getSample(); if (!sample) return;
    let lim = null; try { lim = await sample.limits(); } catch (e2) {}
    if (!lim || !lim.images) return;
    coverStatus("표지에서 제목을 읽는 중… 🔎");
    try {
      const blob = await resizeToBlob(file, 1000);
      if (!blob) { coverStatus(""); return; }
      const r = await withTimeout(sample.json(
        "이것은 책 표지 사진이다. 표지에 실제로 인쇄된 '책 제목'과 '저자'를 그대로 읽어 추출해라. 네가 아는 책 지식으로 추측하지 말고, 사진에 보이는 글자만 사용해라. 안 보이면 빈 문자열.\nJSON으로만: {\"title\":\"...\",\"author\":\"...\"}",
        { images: [blob], modelTier: "default", cache: false }), 25000);
      if (r && (r.title || r.author)) {
        if (r.title && !$("i-book").value.trim()) $("i-book").value = String(r.title).trim();
        if (r.author && !$("i-author").value.trim()) $("i-author").value = String(r.author).trim();
        coverStatus("표지에서 읽었어요 ✨ 맞는지 확인하고 고쳐도 돼요.");
      } else { coverStatus("표지 글자를 못 읽었어요. 직접 입력해 주세요."); }
    } catch (e3) { coverStatus("표지 글자를 못 읽었어요. 직접 입력해 주세요."); }
  });

  const normBook = (x) => (x || "").trim().replace(/\s+/g, "").toLowerCase();
  $("b-setup").addEventListener("click", () => {
    const book = $("i-book").value.trim();
    if (!book) { err("e-setup", "책 제목을 넣어 주세요."); $("i-book").focus(); return; }
    hideErr("e-setup");
    const author = $("i-author").value.trim(), reason = $("i-reason").value.trim();
    // 같은 책 폴더가 이미 있으면 새로 만들지 않고 그 폴더에 이어서
    const existing = loadAll().find(r => r.id !== S.id && normBook(r.book) === normBook(book));
    if (existing) {
      const cur = S.id;
      S = freshSession(Object.assign({}, existing, { readonly: false }));
      S.turns = (existing.turns || []).slice();
      S.prevPage = existing.page || 0; // 지난번 도달 쪽부터 이어서
      S.memo = ""; S.questions = []; S.done = false;
      if (author) S.author = author; if (reason) S.reason = reason;
      if (cur !== existing.id) saveAll(loadAll().filter(r => r.id !== cur)); // 방금 만든 빈 폴더 삭제
      renderTop();
      pushTurn("ai", "『" + S.book + "』 이어서 읽는군요 🌱 지난 폴더에 계속 쌓을게요. 조금 읽고 와서 새 메모를 남겨 주세요.");
      setMode("memo"); upsert(S); return;
    }
    S.book = book; S.author = author; S.reason = reason; renderTop();
    pushTurn("ai", "『" + S.book + "』 좋네요 🌱 저는 책 내용을 미리 알진 못해요. 대신 읽은 걸 메모로 적어주면, 그걸 보고 같이 이야기할게요.\n먼저 조금 읽고 와서 메모를 남겨 주세요.");
    setMode("memo"); upsert(S);
  });

  $("b-memo").addEventListener("click", async () => {
    const page = parseInt($("i-page").value, 10); const memo = $("i-memo").value.trim();
    if (!memo) { err("e-memo", "읽은 부분 메모를 몇 줄 적어 주세요. 완두는 이걸 보고 질문해요."); $("i-memo").focus(); return; }
    hideErr("e-memo");
    if (Number.isFinite(page)) S.page = page;
    S.memo = memo; S.rounds += 1; renderTop();
    const s = S;
    pushTurn("me", (Number.isFinite(page) ? "[" + page + "쪽까지] " : "") + memo);
    PANELS.forEach(p => $(p).hidden = true); setTyping(true);
    let qs = null; const sample = await getSample();
    if (sample) {
      try {
        const r = await withTimeout(sample.json(
          RULES + "\n책 제목(호칭용): 『" + S.book + "』\n읽는 이유: " + (S.reason || "(없음)") +
          (S.author ? "\n저자: " + S.author : "") + (S.page != null ? "\n읽은 곳: " + S.page + "쪽까지" : "") +
          (pastMemos(S, false) ? "\n지난 회차 메모:\n- " + pastMemos(S, false) : "") +
          "\n사용자가 방금 적은 메모:\n\"\"\"" + memo + "\"\"\"\n이 메모를 바탕으로 생각을 깊게 하는 토론 질문 3개를 만들어라.\n" +
          "규칙: ① 질문마다 메모 속 구체적 단어·표현(인물·장면·문장·개념)을 그대로 하나 넣어라. " +
          "② 세 질문의 역할: 1번 해석 — 소설이면 인물이 왜 그렇게 했는지·그 문장이 무슨 뜻인지, 비문학이면 저자 주장의 근거가 뭔지 '왜'로 묻기. " +
          "2번 관점 — 다른 해석이나 반대 입장을 짧게 제시하고 사용자 생각을 묻기, 또는 사용자의 삶·읽는 이유와 연결하기. " +
          "3번 연결 — 지난 회차 메모가 있으면 그것과 지금 메모를 엮어 묻기, 없으면 다음 전개나 저자 의도 짐작하기. " +
          "③ 제목·저자로 장르(소설/에세이/자기계발·인문·과학/시)를 짐작해 묻는 방식을 맞춰라. 단 책 내용을 아는 척 단정하지 마라. " +
          "④ 예/아니오로 끝나는 질문, '가장 기억에 남는 건?'·'어떻게 느꼈어요?' 같은 막연한 질문 금지. 각 70자 이내의 자연스러운 한국어. 메모에 없는 장면은 지어내지 마라.\nJSON으로만: {\"questions\":[\"...\",\"...\",\"...\"]}",
          { modelTier: "quick", cache: false }), 18000);
        if (r && Array.isArray(r.questions)) qs = r.questions.map(x => String(x).trim()).filter(Boolean).slice(0, 3);
      } catch (e) {}
    }
    setTyping(false);
    if (!qs || qs.length < 3) qs = localQuestions(s, memo);
    const qTurn = { role: "ai", text: qs.map((q, i) => (i + 1) + ". " + q).join("\n"), kind: "q" };
    if (S !== s) { s.questions = qs; s.turns.push(qTurn); s.mode = "answer"; upsert(s); return; } // 기다리는 동안 다른 폴더로 옮겨 감
    S.questions = qs; S.turns.push(qTurn); renderConvo();
    $("i-answer").value = ""; setMode("answer"); upsert(S);
  });

  // 계속 채팅: 답을 보내면 완두가 반응하고 입력창이 그대로 남음
  $("b-answer").addEventListener("click", async () => {
    const a = $("i-answer").value.trim(); if (!a) { $("i-answer").focus(); return; }
    $("i-answer").value = "";
    pushTurn("me", a); PANELS.forEach(p => $(p).hidden = true); setTyping(true);
    const s = S;
    const lastQ = S.turns.map(t => t.kind).lastIndexOf("q");
    const answered = S.turns.slice(lastQ + 1).filter(t => t.role === "me" && hangulLen(t.text) >= 6).length - 1; // 방금 답까지 센 수 - 1 → slice(answered + 1)로 다룬 질문을 건너뜀
    let reply = ""; const sample = await getSample();
    if (sample) {
      try {
        const convo = S.turns.slice(Math.max(0, lastQ - 1)).slice(-16).map(t => (t.role === "ai" ? "완두: " : "나: ") + t.text).join("\n");
        const r = await withTimeout(sample.json(
          RULES + "\n책: 『" + S.book + "』" + (S.author ? " · " + S.author : "") + (S.reason ? "\n읽는 이유: " + S.reason : "") +
          (pastMemos(S, true) ? "\n지난 회차 메모:\n- " + pastMemos(S, true) : "") +
          "\n사용자가 읽고 적은 메모: \"\"\"" + S.memo + "\"\"\"\n지금까지 대화:\n" + convo +
          "\n아직 안 다룬 질문: " + ((S.questions || []).slice(Math.max(0, answered + 1)).join(" / ") || "(없음 — 질문은 다 다룸)") + (S.page != null ? "\n지금 " + S.page + "쪽까지 읽음" : "") +
          "\n\n너의 목표는 사용자가 이 책을 깊이 생각하며 끝까지 읽게 돕는 것이다. 사용자의 마지막 말에 2~4문장으로 반응하라. " +
          "① 사용자 말의 핵심을 구체적으로 짚고, 그 생각을 한 걸음 넓혀라 — 다른 해석, 반대 관점, 지난 회차 메모와의 연결, (확실할 때만) 작가·시대 배경 중 하나. '좋아요', '더 들려주세요' 같은 빈 맞장구 금지. " +
          "② 마지막은 질문 하나로 끝내라: 아직 안 다룬 질문 잇기 / 왜 그렇게 생각했는지 근거 묻기 / 어느 문장이 그랬는지 묻기. " +
          "③ 사용자 답이 짧거나 성의 없으면 다그치지 말고, 부담 없이 답할 수 있는 쉬운 질문으로 바꿔라. " +
          "④ 대화가 4번 넘게 오갔으면 질문 대신, 지금 생각을 품고 다음 몇 쪽을 더 읽은 뒤 메모하자고 권하라. " +
          "⑤ 앞에서 한 말 반복 금지, 읽은 쪽 이후 스포일러 금지, 메모·대화에 없는 장면 지어내기 금지.\nJSON으로만: {\"reply\":\"...\"}",
          { modelTier: "quick", cache: false }), 15000);
        if (r && typeof r.reply === "string") reply = r.reply.trim();
      } catch (e) {}
    }
    setTyping(false);
    const text = reply || localReply(s, a);
    if (S !== s) { s.turns.push({ role: "ai", text, kind: "" }); upsert(s); return; }
    pushTurn("ai", text);
    setMode("answer"); upsert(S);
  });

  $("b-more").addEventListener("click", () => { $("i-page").value = S.page != null ? S.page : ""; $("i-memo").value = ""; setMode("memo"); });
  $("b-memo-back").addEventListener("click", () => {
    if (S.turns.some(t => t.role === "me") || (S.questions && S.questions.length)) { setMode("answer"); }
    else { S.turns = []; renderConvo(); $("i-book").value = S.book || ""; $("i-author").value = S.author || ""; $("i-reason").value = S.reason || ""; setMode("setup"); syncCover(); setTimeout(() => $("i-book").focus(), 50); }
  });
  $("b-finish").addEventListener("click", finish);
  // 이번 독서분: 지난 '마치기'·'이어 읽기' 안내 이후의 내 메모·답
  function todayMine(s) {
    let from = 0;
    s.turns.forEach((t, i) => { if (t.role === "ai" && /^(오늘 수고했어요|다시 이어서 읽어요|『.*』 이어서 읽는군요)/.test(t.text)) from = i + 1; });
    return s.turns.slice(from).filter(t => t.role === "me").map(t => t.text);
  }
  async function finish() {
    PANELS.forEach(p => $(p).hidden = true); setTyping(true);
    let summary = ""; const sample = await getSample();
    if (sample) {
      try {
        const mine = todayMine(S).join(" / ").slice(-4000);
        const r = await withTimeout(sample.json(
          RULES + "\n사용자가 오늘 적은 메모·답 모음: \"\"\"" + mine + "\"\"\"\n이것에만 근거해, 오늘 읽은 내용을 한 줄(40자 이내)로 담담히 요약해라. 지어내지 마라.\nJSON으로만: {\"summary\":\"...\"}",
          { modelTier: "quick", cache: false }), 15000);
        if (r && typeof r.summary === "string") summary = r.summary.trim();
      } catch (e) {}
    }
    setTyping(false);
    const mine = todayMine(S).join(" ");
    S.summary = summary || (mine.slice(0, 40) + (mine.length > 40 ? "…" : ""));
    const pages = S.page != null ? Math.max(0, S.page - (S.prevPage || 0)) : null;
    const pass = pages != null && pages >= 4;
    pushTurn("ai", "오늘 수고했어요 🌱 " + (pass ? "4페이지 고비를 넘겼어요!" : "기록 남겨 뒀어요.") + "\n다음에 ‘이어서 더 읽기’를 누르면 이 폴더에 계속 쌓여요.");
    S.done = true; upsert(S); renderDonePanel(false); setMode("done");
  }
  function renderDonePanel(readonly) {
    const pages = S.page != null ? Math.max(0, S.page - (S.prevPage || 0)) : null;
    const pass = pages != null && pages >= 4;
    $("done-result").innerHTML = readonly
      ? "<b>지난 대화</b> · " + esc(S.date || "") + (pages != null ? " · " + pages + "쪽 " + (pass ? "(통과)" : "") : "")
      : (pages != null ? "<b>" + pages + "쪽</b> 읽었어요" + (pass ? " · 통과 🎉" : "") + ". " : "") + "요약: " + esc(S.summary || "");
    $("b-continue").textContent = readonly ? "이 책 이어 읽기" : "이어서 더 읽기";
  }
  // 평소엔 대화만 보이고, 대화창을 누르면 입력이 올라옴 (다시 누르면 내려감)
  function collapseDock() { $("dock").classList.add("collapsed"); $("reopen").hidden = false; }
  function expandDock() {
    $("dock").classList.remove("collapsed"); $("reopen").hidden = true;
    if (S && S.mode === "answer") setTimeout(() => $("i-answer").focus(), 50);
  }
  $("reopen").addEventListener("click", expandDock);

  $("b-tohome").addEventListener("click", showHome);
  $("b-continue").addEventListener("click", continueFrom);
  $("back-btn").addEventListener("click", showHome);
  $("logo").addEventListener("click", showHome);
  $("add-folder").addEventListener("click", createFolder);
  let manageMode = false;
  $("manage-btn").addEventListener("click", () => {
    manageMode = !manageMode;
    $("folders").classList.toggle("manage", manageMode);
    $("manage-btn").classList.toggle("active", manageMode);
    $("manage-btn").setAttribute("aria-label", manageMode ? "정리 완료" : "폴더 정리");
    renderTrash();
  });

  // 제목 (눌러서 전체 수정)
  const DEFAULT_TITLE = "나의 과거대화";
  let headTitle = DEFAULT_TITLE;
  try { headTitle = localStorage.getItem("wandu-title") || DEFAULT_TITLE; } catch (e) {}
  function renderHead() {
    $("home-head-h2").innerHTML = '<span class="nick" id="nick-span">' + esc(headTitle) + '</span>';
    $("nick-span").addEventListener("click", startEditNick);
  }
  function startEditNick() {
    $("home-head-h2").innerHTML = '<input class="nick-input" id="nick-input" maxlength="30" aria-label="제목">';
    const inp = $("nick-input"); inp.value = headTitle; inp.focus(); inp.select();
    let done = false;
    const commit = () => { if (done) return; done = true; headTitle = inp.value.trim() || DEFAULT_TITLE; try { localStorage.setItem("wandu-title", headTitle); } catch (e) {} renderHead(); };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } else if (e.key === "Escape") { done = true; renderHead(); } });
    inp.addEventListener("blur", commit);
  }

  $("nick-btn").addEventListener("click", startEditNick);

  function err(id, msg) { const e = $(id); e.textContent = msg; e.hidden = false; }
  function hideErr(id) { $(id).hidden = true; }

  renderHead(); showHome();
})();
</script>
