<title>읽기 친구 완두</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 한 화면 채팅: 위에 얇은 진행선, 가운데 완두와의 대화, 아래 입력칸. 기록표는 맨 밑에 접힘. 책 면지 초록 + 종이색. */
:root {
  --paper: #eef1ec;
  --card: #ffffff;
  --ink: #1d2a25;
  --muted: #5d6b65;
  --line: #dde3dd;
  --green: #2f5d50;
  --green-deep: #244a40;
  --ai-bg: #e9efe9;
  --me-bg: #2f5d50;
  --me-ink: #f4f8f4;
  --mark: #c0502e;
  --ok: #2f7a4f;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121714; --card: #1a211c; --ink: #e5ece6; --muted: #9aa8a1; --line: #2a3530;
    --green: #8cc5ad; --green-deep: #a7d6c2; --ai-bg: #222c27; --me-bg: #35604f; --me-ink: #f1f7f3; --mark: #e8865f; --ok: #7fcf9c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121714; --card: #1a211c; --ink: #e5ece6; --muted: #9aa8a1; --line: #2a3530;
  --green: #8cc5ad; --green-deep: #a7d6c2; --ai-bg: #222c27; --me-bg: #35604f; --me-ink: #f1f7f3; --mark: #e8865f; --ok: #7fcf9c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; margin: 0; }

/* 진행선 */
#bar { position: sticky; top: env(safe-area-inset-top, 0px); height: 3px; background: transparent; z-index: 5; }
#bar > i { display: block; height: 100%; width: 0%; background: var(--green); transition: width .5s linear; }
@media (prefers-reduced-motion: reduce) { #bar > i, .prog { transition: none; } }

.shell { max-width: 620px; margin: 0 auto; padding: 0 14px 40px; display: flex; flex-direction: column; min-height: 100%; }

/* 헤더 */
header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 4px 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.brand .book { font-size: 13px; color: var(--muted); max-width: 48vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pace { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 8px; font-family: inherit; }
.pace:hover { color: var(--green); }

/* 대화 */
.chat { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px 2px 20px; }
.msg { display: flex; flex-direction: column; max-width: 82%; gap: 3px; }
.msg.ai { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.sys { align-self: center; max-width: 90%; }
.who { font-size: 11px; color: var(--muted); padding: 0 4px; display: flex; align-items: center; gap: 5px; }
.bubble { padding: 11px 15px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
.ai .bubble { background: var(--ai-bg); border-bottom-left-radius: 5px; }
.me .bubble { background: var(--me-bg); color: var(--me-ink); border-bottom-right-radius: 5px; }
.ai .bubble.q { font-family: var(--font-display); font-size: 17px; line-height: 1.5; }
.sys .bubble { background: transparent; color: var(--muted); font-size: 12.5px; padding: 2px 10px; text-align: center; }
.sprout { width: 20px; height: 20px; flex: none; }
.typing span { display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
@keyframes blink { 0%,80%,100%{ opacity:.25; transform: translateY(0) } 40%{ opacity:1; transform: translateY(-3px) } }

/* 입력 영역 (하단 고정) */
.dock { position: sticky; bottom: 0; background: linear-gradient(to top, var(--paper) 72%, transparent); padding: 10px 2px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer { display: flex; gap: 8px; align-items: flex-end; }
textarea#entry { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 11px 16px; resize: none; max-height: 120px; line-height: 1.4; }
textarea#entry:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.send { flex: none; width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--green); color: #fff; cursor: pointer; font-size: 18px; display: grid; place-items: center; }
.send:disabled { opacity: .4; cursor: default; }

/* 읽는 중 패널 */
.reading { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.reading .status { flex: 1 1 auto; min-width: 140px; }
.reading .status b { font-family: var(--font-display); font-size: 16px; display: block; }
.reading .status span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.reading .acts { display: flex; gap: 7px; }
.mini { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 12px; padding: 8px 11px; }
.mini.go { background: var(--green); color: #fff; border-color: var(--green); }

/* 퀵칩 */
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 2px 4px; }
.chip { font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--green); color: var(--green); background: transparent; border-radius: 99px; padding: 9px 16px; }
.chip.solid { background: var(--green); color: #fff; }

/* 기록표 (접힘) */
.records { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 14px; }
.records summary { cursor: pointer; font-size: 14px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
.records summary::-webkit-details-marker { display: none; }
.records summary .tri { transition: transform .2s; }
.records[open] summary .tri { transform: rotate(90deg); }
.records .inner { padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.summary-row { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--card); }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 500px; font-size: 13px; }
th { background: var(--green); color: #fff; text-align: left; font-weight: 600; padding: 8px 10px; white-space: nowrap; }
td { border-top: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; }
.pass { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; font-weight: 600; }
.pass.y { color: var(--ok); border: 1px solid var(--ok); }
.pass.n { color: var(--mark); border: 1px solid var(--mark); }
tr.example td { color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

/* 메뉴 버튼 + 왼쪽 서랍(지난 대화) */
.iconbtn { font: inherit; font-size: 19px; line-height: 1; background: none; border: none; color: var(--ink); cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.iconbtn:hover { background: var(--ai-bg); }
.iconbtn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#overlay.on { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 82vw); background: var(--card); border-right: 1px solid var(--line); z-index: 21;
  transform: translateX(-100%); transition: transform .22s ease; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#drawer.on { transform: translateX(0); }
.dw-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
.dw-head b { font-family: var(--font-display); font-size: 17px; }
.dw-new { margin: 0 16px 12px; padding: 11px; border-radius: 12px; border: 1px dashed var(--green); background: transparent; color: var(--green); font: inherit; font-weight: 600; cursor: pointer; }
.dw-list { flex: 1; overflow-y: auto; padding: 0 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.dw-item { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
.dw-item:hover { background: var(--ai-bg); }
.dw-item .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dw-item .m { font-size: 12px; color: var(--muted); }
.dw-empty { color: var(--muted); font-size: 13px; padding: 10px 14px; }
.dw-del { align-self: flex-end; font-size: 11px; color: var(--mark); background: none; border: none; cursor: pointer; padding: 2px 0 0; }
/* 지난 대화 열람 오버레이 */
#viewer { position: fixed; inset: 0; background: var(--paper); z-index: 25; display: none; flex-direction: column; padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
#viewer.on { display: flex; }
.vw-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.vw-head b { font-family: var(--font-display); font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 620px; margin: 0 auto; width: 100%; }
</style>

<div id="bar"><i id="bar-fill"></i></div>

<div class="shell">
  <header>
    <div class="brand">
      <button class="iconbtn" id="menu-btn" type="button" aria-label="지난 대화 열기">☰</button>
      <h1>완두</h1>
      <span class="book" id="book-tag"></span>
    </div>
    <div style="display:flex;gap:4px;align-items:center">
      <button class="pace" id="pace-btn" type="button" hidden>5분마다 말 걸기 · 바꾸기</button>
      <button class="pace" id="reset-btn" type="button" hidden>＋ 새 대화</button>
    </div>
  </header>

  <div class="chat" id="chat" aria-live="polite"></div>

  <div class="dock">
    <!-- 읽는 중 -->
    <div class="reading" id="reading" hidden>
      <div class="status">
        <b id="read-head">읽는 중…</b>
        <span id="read-sub">다음 이야기까지 5:00</span>
      </div>
      <div class="acts">
        <button class="mini" id="r-pause" type="button">잠시 멈춤</button>
        <button class="mini" id="r-ask" type="button">지금 질문</button>
        <button class="mini go" id="r-stop" type="button">그만 읽기</button>
      </div>
    </div>

    <!-- 퀵칩 -->
    <div class="chips" id="chips" hidden></div>

    <!-- 입력 -->
    <form class="composer" id="composer" hidden>
      <textarea id="entry" rows="1" placeholder="여기에 적어 주세요" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" aria-label="보내기" disabled>↑</button>
    </form>
  </div>

  <details class="records" id="records">
    <summary><span class="tri">▶</span> <span id="rec-head">함께 읽는 사람들의 기록</span></summary>
    <div class="inner">
      <p class="note">이 앱으로 읽은 사람들의 기록이 모여요. 한 번에 4쪽보다 많이 읽었으면 ‘통과’예요.</p>
      <div class="summary-row">
        <div class="stat"><b id="s-people">0</b><span>테스트한 사람</span></div>
        <div class="stat"><b id="s-pass">0</b><span>통과한 사람</span></div>
        <div class="stat"><b id="s-reads">0</b><span>전체 읽기 횟수</span></div>
      </div>
      <div class="tablebox">
        <table>
          <thead><tr><th>날짜</th><th>테스터</th><th>책</th><th>읽은 쪽</th><th>세션</th><th>통과</th><th>방해</th><th>한 줄</th></tr></thead>
          <tbody id="log-body">
            <tr class="example"><td class="num">10/12</td><td>예시</td><td>(예시) 책</td><td class="num">12</td><td class="num">3</td><td><span class="pass y">통과</span></td><td>아니요</td><td>질문 덕에 다시 집중됨</td></tr>
          </tbody>
        </table>
      </div>
      <p class="note" id="store-note">기록을 불러오는 중이에요.</p>
    </div>
  </details>
</div>

<div id="overlay"></div>
<aside id="drawer" aria-label="지난 대화">
  <div class="dw-head"><b>내 독서 기록</b><button class="iconbtn" id="dw-close" type="button" aria-label="닫기">✕</button></div>
  <button class="dw-new" id="dw-new" type="button">＋ 새 대화 시작</button>
  <div class="dw-list" id="dw-list"></div>
</aside>
<div id="viewer">
  <div class="vw-head"><button class="iconbtn" id="vw-close" type="button" aria-label="뒤로">←</button><b id="vw-title"></b></div>
  <div class="vw-body" id="vw-body"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), entry = $("entry"), composer = $("composer"), send = $("send"),
        reading = $("reading"), chips = $("chips");

  const SPROUT = '<svg class="sprout" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 14c0-3 2-4 5-4 0 3-2 4-5 4Z" fill="currentColor" opacity=".85"/><path d="M12 15c0-3-2-4.5-5-4.5 0 3 2 4.5 5 4.5Z" fill="currentColor"/></svg>';

  const FALLBACK_Q = [
    "방금 읽은 데서 기억나는 게 하나 있어요?",
    "지금까지 나온 사람이나 말 중에 하나만 들려줄래요?",
    "방금 부분을 한 문장으로 줄이면 뭐가 될까요?",
    "읽다가 ‘오’ 했던 데가 있었어요?",
    "다음엔 무슨 얘기가 나올 것 같아요?",
    "방금 읽은 데서 제일 의외였던 건요?",
    "친구한테 한 줄로 말한다면 뭐라고 할래요?"
  ];
  const FALLBACK_P = [
    "오, 그걸 잡아냈네요. 잘 읽고 있다는 뜻이에요.",
    "좋아요. 그 느낌 그대로 조금만 더 가봐요.",
    "한 줄로 정리하는 거 잘하시는데요. 다음도 가볍게.",
    "지금이 제일 넘기 힘든 구간이에요. 잘하고 있어요."
  ];
  const INTERVALS = [3, 5, 10];
  const RULES = "너는 '완두'라는 다정한 독서 친구다. 부드러운 반말 섞인 친근한 존댓말(예: '~했어요?'), 한국어로만. 이모지는 많아야 하나.\n"
    + "절대 규칙(매우 중요): 너는 이 책의 실제 내용을 알지 못한다. 책의 줄거리·등장인물·사건·배경·결말·주제를 네가 먼저 말하거나 아는 척 암시하지 마라 — 틀린 내용을 지어내는 것이다. "
    + "특정 인물 이름이나 장면을 네가 꺼내지 마라. 오직 '사용자가 방금 읽고 말해 준 내용'에만 반응하고, 사용자가 스스로 떠올리게 하는 열린 질문만 해라. 책에 대해 아는 게 없으면 솔직히 모른다는 전제로 묻는다.";
  function bookCtx() {
    return "사용자가 읽는 책 제목: 『" + S.book + "』" + (S.author ? " (저자: " + S.author + ")" : "")
      + "\n(제목·저자는 호칭용일 뿐, 너는 이 책의 내용을 알지 못한다. 내용을 지어내지 말 것.)";
  }
  function posCtx() {
    if (S.startPage == null) return "";
    return "\n사용자는 " + S.startPage + "쪽 근처부터 읽기 시작해 지금 " + (S.session + 1) + "번째 구간을 읽는 중이다. (쪽수·분량·책의 어느 지점인지 추측해 단정하지 마라.)";
  }

  // ---- 상태 ----
  function fresh() {
    return { id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      phase: "intro", book: "", author: "", knows: null, interval: 5, session: 0,
      startPage: null, endAt: 0, paused: false, pausedLeft: 0,
      messages: [], qa: [], question: "", nextQuestion: "",
      pagesRead: null, disturbed: null, greeted: false };
  }
  let S = fresh();
  const save = () => { try { localStorage.setItem("wandu-run", JSON.stringify(S)); } catch (e) {} };
  try { const r = JSON.parse(localStorage.getItem("wandu-run") || "null"); if (r && r.phase) S = Object.assign(fresh(), r); } catch (e) {}

  // ---- 메시지 ----
  function push(role, text, kind) { S.messages.push({ role, text, kind: kind || "" }); save(); renderChat(); }
  function renderChat() {
    chat.textContent = "";
    S.messages.forEach(m => chat.appendChild(bubble(m)));
    if (pendingTyping) chat.appendChild(typingEl());
    requestAnimationFrame(() => chat.scrollIntoView ? window.scrollTo(0, document.body.scrollHeight) : null);
    chat.lastElementChild && chat.lastElementChild.scrollIntoView({ block: "end" });
  }
  function bubble(m) {
    const wrap = document.createElement("div"); wrap.className = "msg " + m.role;
    if (m.role === "ai") { const w = document.createElement("div"); w.className = "who"; w.innerHTML = SPROUT + "<span>완두</span>"; wrap.appendChild(w); }
    const b = document.createElement("div"); b.className = "bubble" + (m.kind === "q" ? " q" : "");
    b.textContent = m.text; wrap.appendChild(b); return wrap;
  }
  let pendingTyping = false;
  function typingEl() {
    const wrap = document.createElement("div"); wrap.className = "msg ai";
    const w = document.createElement("div"); w.className = "who"; w.innerHTML = SPROUT + "<span>완두</span>"; wrap.appendChild(w);
    const b = document.createElement("div"); b.className = "bubble typing"; b.innerHTML = "<span></span><span></span><span></span>"; wrap.appendChild(b); return wrap;
  }
  function setTyping(on) { pendingTyping = on; renderChat(); }

  // 입력칸과 함께 '건너뛰기' 같은 보조 칩 하나를 띄움 (mode('input') 뒤에 호출)
  function showSkip(label, fn) {
    chips.hidden = false; chips.textContent = "";
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = label;
    b.addEventListener("click", fn); chips.appendChild(b);
  }

  // ---- 하단 모드 ----
  // reading: 읽기 배너 + 입력창(아무 때나 대화 가능) / input: 입력창만 / chips: 선택지만
  function mode(which, opts) {
    reading.hidden = which !== "reading";
    composer.hidden = !(which === "input" || which === "reading");
    chips.hidden = which !== "chips";
    if (which === "input") {
      entry.value = ""; entry.placeholder = (opts && opts.ph) || "여기에 적어 주세요";
      entry.style.height = "auto"; send.disabled = true; setTimeout(() => entry.focus(), 60);
    } else if (which === "reading") {
      entry.placeholder = "읽다가 하고 싶은 말이 있으면 적어도 돼요";
      send.disabled = !entry.value.trim();
    }
    if (which === "chips") { chips.textContent = ""; (opts.items || []).forEach(it => {
      const c = document.createElement("button"); c.type = "button"; c.className = "chip" + (it.solid ? " solid" : "");
      c.textContent = it.label; c.addEventListener("click", it.on); chips.appendChild(c);
    }); }
  }

  // ---- 진행선 / 타이머 ----
  let tick = null, wake = null;
  function left() { return S.paused ? S.pausedLeft : Math.max(0, S.endAt - Date.now()); }
  function startReading(announce) {
    S.phase = "reading"; S.endAt = Date.now() + S.interval * 60000; S.paused = false; save();
    if (announce) push("sys", "⏳ 읽는 시간 — " + S.interval + "분 뒤에 말 걸게요");

  }
  function runTick() {

      $("read-sub").textContent = S.paused ? "잠깐 멈췄어요" : "다음 이야기까지 " + Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      $("bar-fill").style.width = (total ? (1 - ms / total) * 100 : 0) + "%";

    };

  }
  $("r-pause").addEventListener("click", () => {
    if (S.paused) { S.endAt = Date.now() + S.pausedLeft; S.paused = false; requestWake(); }
    else { S.pausedLeft = left(); S.paused = true; releaseWake(); }
    $("r-pause").textContent = S.paused ? "다시 읽기" : "잠시 멈춤"; $("read-head").textContent = S.paused ? "잠깐 쉬는 중" : "읽는 중…"; save();
  });
  $("r-ask").addEventListener("click", () => { clearInterval(tick); releaseWake(); $("bar-fill").style.width = "0%"; askQuestion(); });
  $("r-stop").addEventListener("click", wrapUp);

  async function requestWake() { try { wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; } }

  }

  // ---- AI ----
  let samplePromise = null;
  const getSample = () => (samplePromise = samplePromise || (window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null)));
  const pick = (a, i) => a[((i % a.length) + a.length) % a.length];
  // AI가 늦거나 멈춰도 화면이 안 멈추게 시간제한(최대 25초). 넘으면 null → 준비된 문장으로.
  const withTimeout = (p, ms) => Promise.race([p, new Promise(res => setTimeout(() => res(null), ms || 25000))]);

  // 아는 책인지 먼저 확인 (출처: Claude 학습 지식. 모르면 솔직히 모른다고.)
  function askStartPage() {
    S.phase = "ask_page"; save();
    push("ai", "지금 몇 쪽부터 읽어요? 알려주면 ‘어디쯤인지’ 보면서 응원할게요. (몰라도 괜찮아요)");

  }
  function beginReading() {
    push("ai", "좋아요, 편하게 읽어 보세요. 제가 " + S.interval + "분마다 살짝 말 걸게요! 🌱");
    startReading(true);
  }

  // 책 내용을 안다고 주장하지 않음(할루시네이션 방지). 솔직한 안내만.
  function identifyBook() {
    S.knows = false; save();
    push("ai", "『" + S.book + "』 좋네요 🌱 저는 책 내용을 미리 알진 못해요. 대신 읽으면서 떠오르는 걸 같이 이야기하며 끝까지 가게 도울게요.");
    askStartPage();
  }

  async function prefetchQuestion() {
    if (S.nextQuestion) return;
    const sample = await getSample(); if (!sample) return;
    try {
      const hist = S.qa.map((x, i) => `${i + 1}. 질문:${x.q} / 답:${x.a}`).join("\n") || "(아직 없음)";
      const first = S.session === 0;
      const r = await withTimeout(sample.json(
        `${RULES}\n${bookCtx()}${posCtx()}\n지금까지 대화:\n${hist}\n${first ? "사용자가 이제 막 읽기 시작했다. 책 첫 부분은 지루해서 멈추기 쉽다." : "사용자가 방금 한 구간을 더 읽었다."}\n사용자가 방금 읽은 걸 스스로 떠올리게 하는 열린 질문 하나를 30자 이내로 만들어라. 책 내용을 네가 지어내지 말고, 앞 질문들과 겹치지 않게.\nJSON으로만: {"question":"..."}`,
        { modelTier: "quick", cache: false }), 15000);
      if (r && typeof r.question === "string") { S.nextQuestion = r.question.trim(); save(); }
    } catch (e) {}
  }

  function askQuestion() {
    S.phase = "asking";
    S.question = S.nextQuestion || pick(FALLBACK_Q, S.session); S.nextQuestion = ""; save();
    push("ai", S.question, "q");
    mode("input", { ph: "한 줄로 답해 보세요" });
  }

  async function handleAnswer(text) {
    S.qa[S.session] = { q: S.question, a: text };
    S.session += 1; save();
    push("me", text);
    setTyping(true);
    let praise = "", next = "";
    const sample = await getSample();
    if (sample) {
      try {
        const hist = S.qa.map((x, i) => `${i + 1}. 질문:${x.q} / 답:${x.a}`).join("\n");
        const r = await withTimeout(sample.json(
          `${RULES}\n${bookCtx()}${posCtx()}\n대화:\n${hist}\n방금 답: ${text}\n\n1) praise: 방금 '사용자 답'에만 근거해 따뜻하게 반응하는 1문장(50자 이내). 책 내용을 네가 덧붙이거나 지어내지 마라. 계속 읽고 싶게.\n2) next: 사용자가 다음에 읽고 떠올리게 할 열린 질문 하나(30자 이내). 앞과 안 겹치게.\nJSON으로만: {"praise":"...","next":"..."}`,
          { modelTier: "quick", cache: false }), 15000);
        if (r && typeof r.praise === "string") praise = r.praise.trim();
        if (r && typeof r.next === "string") next = r.next.trim();
      } catch (e) {}
    }
    setTyping(false);
    push("ai", praise || pick(FALLBACK_P, S.session - 1));
    S.nextQuestion = next || pick(FALLBACK_Q, S.session); save();
    startReading(true);
  }

  // 읽는 중에 사용자가 먼저 말을 걸었을 때 (질문이 아니어도 대화 가능)
  async function handleFreeChat(text) {
    push("me", text);
    setTyping(true);
    let reply = "";
    const sample = await getSample();
    if (sample) {
      try {
        const r = await withTimeout(sample.json(
          `${RULES}\n${bookCtx()}${posCtx()}\n사용자가 읽는 중에 이렇게 말했다: "${text}"\n여기에 공감하거나 가볍게 반응하는 1~2문장(60자 이내)으로 답하고, 계속 읽도록 부드럽게 북돋아라. 새 질문은 하지 마라.\nJSON으로만: {"reply":"..."}`,
          { modelTier: "quick", cache: false }), 15000);
        if (r && typeof r.reply === "string") reply = r.reply.trim();
      } catch (e) {}
    }
    setTyping(false);
    push("ai", reply || "좋아요, 그 느낌 안고 조금만 더 읽어봐요 🌱");
    if (S.phase === "reading") mode("reading");
  }

  // ---- 마무리 ----
  function wrapUp() {
    clearInterval(tick); releaseWake(); $("bar-fill").style.width = "0%";
    S.phase = "wrap_pages"; save();
    if (S.startPage != null) {
      push("ai", "오늘 수고했어요 🌱 딱 두 가지만 여쭤볼게요.\n지금 몇 쪽까지 왔어요?");
      mode("input", { ph: "숫자만 (예: " + (S.startPage + 8) + ")" });
    } else {
      push("ai", "오늘 수고했어요 🌱 딱 두 가지만 여쭤볼게요.\n오늘 대략 몇 쪽 읽었어요?");
      mode("input", { ph: "숫자만 (예: 12)" });
    }
    showSkip("잘 모르겠어요", () => { push("me", "잘 모르겠어요"); S.pagesRead = null; save(); askDisturb(); });
  }
  function askDisturb(restore) {
    S.phase = "wrap_disturb"; save();
    if (!restore) push("ai", "제 질문이 읽는 데 방해됐어요?");
    mode("chips", { items: [
      { label: "아니요, 괜찮았어요", on: () => { push("me", "괜찮았어요"); S.disturbed = "no"; finish(); } },
      { label: "조금 방해됐어요", on: () => { push("me", "조금 방해됐어요"); S.disturbed = "yes"; finish(); } }
    ] });
  }
  async function finish() {
    const pages = S.pagesRead, pass = typeof pages === "number" && pages > 4;
    const d = new Date();
    const entry = {
      at: d.toISOString(), date: (d.getMonth() + 1) + "/" + d.getDate(),
      title: S.book, pages: pages, sessions: S.qa.length,
      minutes: S.interval, disturbed: S.disturbed, note: "",
      answers: S.qa.map(x => ({ q: x.q, a: x.a }))

    S.messages.pop(); // remove saving note
    S.phase = "done"; save();

      ? "오늘도 완두랑 " + S.qa.length + "번 이야기했어요. 기록해 뒀어요."

  }
  function newBook() {
    archiveCurrent();
    S = fresh(); S.greeted = true; save();
    push("ai", "좋아요! 이번엔 무슨 책 읽어요?\n제목이랑 저자까지 알려주면 더 깊게 도와드릴 수 있어요.");

  // ---- 지난 대화 저장소 ----
  const HKEY = "wandu-history";
  const loadHistory = () => { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (e) { return []; } };
  const saveHistory = (arr) => { try { localStorage.setItem(HKEY, JSON.stringify(arr.slice(0, 100))); } catch (e) {} };
  // 현재 대화를 기록에 저장(같은 id면 갱신). 의미 있는 대화만.
  function archiveCurrent() {
    if (!S.book || !S.messages.some(m => m.role === "me")) return;
    const hist = loadHistory();
    const snap = { id: S.id, book: S.book, author: S.author, at: Date.now(),
      date: new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric" }),
      messages: S.messages.slice(), qa: S.qa.slice(), sessions: S.qa.length,
      pagesRead: S.pagesRead, startPage: S.startPage };

  }
  function renderDrawer() {
    const list = $("dw-list"); const hist = loadHistory();
    list.textContent = "";
    if (!hist.length) { const e = document.createElement("div"); e.className = "dw-empty"; e.textContent = "아직 지난 대화가 없어요.\n책을 읽고 완두와 이야기하면 여기 쌓여요."; list.appendChild(e); return; }
    hist.forEach(h => {
      const item = document.createElement("button"); item.type = "button"; item.className = "dw-item";
      const t = document.createElement("span"); t.className = "t"; t.textContent = "『" + h.book + "』" + (h.author ? " · " + h.author : "");
      const m = document.createElement("span"); m.className = "m";
      m.textContent = h.date + " · 대화 " + (h.qa ? h.qa.length : 0) + "번" + (h.pagesRead != null ? " · " + h.pagesRead + "쪽" : "");

      item.addEventListener("click", () => openViewer(h));
      list.appendChild(item);
    });
  }
  function openDrawer() { renderDrawer(); $("drawer").classList.add("on"); $("overlay").classList.add("on"); }
  function closeDrawer() { $("drawer").classList.remove("on"); $("overlay").classList.remove("on"); }
  $("menu-btn").addEventListener("click", openDrawer);
  $("dw-close").addEventListener("click", closeDrawer);
  $("overlay").addEventListener("click", closeDrawer);

  function openViewer(h) {
    $("vw-title").textContent = "『" + h.book + "』";

  }
  $("vw-close").addEventListener("click", () => $("viewer").classList.remove("on"));

  // ＋ 새 대화: 지금 대화를 기록에 저장하고 처음부터
  function startNew() {
    archiveCurrent();
    closeDrawer();
    clearInterval(tick); releaseWake();
    try { localStorage.removeItem("wandu-run"); } catch (e) {}
    S = fresh(); S.greeted = true;
    $("book-tag").textContent = ""; $("pace-btn").hidden = true; $("reset-btn").hidden = true;
    $("bar-fill").style.width = "0%";
    push("ai", "안녕하세요, 저는 완두예요 🌱\n오늘은 무슨 책 읽어요? 제목이랑 저자까지 알려주면 더 깊게 도와드려요.");
    mode("input", { ph: "예: 데미안 / 헤르만 헤세" });
    S.phase = "intro"; save();
  }
  $("reset-btn").addEventListener("click", startNew);
  $("dw-new").addEventListener("click", startNew);

  // ---- 입력 처리 ----
  entry.addEventListener("input", () => {
    send.disabled = !entry.value.trim();

  });
  entry.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); composer.requestSubmit(); } });
  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = entry.value.trim(); if (!text) return;
    entry.value = ""; entry.style.height = "auto"; send.disabled = true;
    unlockAudio();
    if (S.phase === "intro") {
      const seg = text.split(/[\/,\n·]| - |저자\s*[:：]?/).map(s => s.trim()).filter(Boolean);
      S.book = (seg[0] || text).replace(/^『|』$/g, ""); S.author = seg[1] || ""; save();
      $("book-tag").textContent = "『" + S.book + "』" + (S.author ? " · " + S.author : "");
      $("pace-btn").hidden = false; $("reset-btn").hidden = false;
      push("me", text);
      identifyBook();
    } else if (S.phase === "ask_page") {
      const n = parseInt(text.replace(/[^0-9]/g, ""), 10);
      push("me", text);
      S.startPage = Number.isFinite(n) ? n : null; save();
      beginReading();
    } else if (S.phase === "asking") {
      handleAnswer(text);
    } else if (S.phase === "reading") {
      handleFreeChat(text);
    } else if (S.phase === "wrap_pages") {
      const n = parseInt(text.replace(/[^0-9]/g, ""), 10);
      push("me", text);
      if (S.startPage != null && Number.isFinite(n)) S.pagesRead = Math.max(0, n - S.startPage);
      else S.pagesRead = Number.isFinite(n) ? n : null;
      askDisturb();
    }
  });

  // ---- 페이스 변경 ----
  $("pace-btn").addEventListener("click", () => {
    const i = (INTERVALS.indexOf(S.interval) + 1) % INTERVALS.length;
    S.interval = INTERVALS[i]; save();
    $("pace-btn").textContent = S.interval + "분마다 말 걸기 · 바꾸기";
    if (S.phase === "reading" && !S.paused) { S.endAt = Date.now() + S.interval * 60000; runTick(); }
  });

  // ---- 저장소 (공유 기록) ----
  let db = null, user = null, myId = null, myEntries = [], localMode = false, allDocs = [];
  const LKEY = "wandu-logs";
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LKEY) || "[]"); } catch (e) { return []; } };
  async function storeEntry(entry) {
    if (!localMode && db && myId) {
      try { const list = myEntries.concat([entry]).slice(-200);
        await db.doc("logs/" + myId).set({ entries: list, updatedAt: entry.at }); myEntries = list; return true;
      } catch (e) { localMode = true; }
    }
    try { const l = loadLocal(); l.push(entry); localStorage.setItem(LKEY, JSON.stringify(l)); renderLocal(); return true; } catch (e) { return false; }
  }
  const renderLocal = () => renderTable([{ id: "local", entries: loadLocal() }], { local: "나 (이 기기)" });
  async function renderShared() {
    const ids = allDocs.map(d => d.id).filter(x => x !== "local");
    let names = {}; if (user && ids.length) { try { const ps = await user.profiles(ids); ids.forEach(id => names[id] = (ps[id] && ps[id].name) || "테스터"); } catch (e) {} }
    if (myId) names[myId] = names[myId] && names[myId] !== "테스터" ? names[myId] : "나";
    names["local"] = "나 (이 기기)";
    renderTable(allDocs, names);
  }
  function renderTable(docs, names) {
    const rows = []; let people = 0, passed = 0;
    docs.forEach(d => { const es = Array.isArray(d.entries) ? d.entries : []; if (!es.length) return;
      people++; if (es.some(e => typeof e.pages === "number" && e.pages > 4)) passed++;
      es.forEach(e => rows.push({ who: names[d.id] || "테스터", e })); });
    rows.sort((a, b) => String(b.e.at).localeCompare(String(a.e.at)));
    $("s-people").textContent = people; $("s-pass").textContent = passed; $("s-reads").textContent = rows.length;
    const tb = $("log-body"); if (!rows.length) return; tb.textContent = "";
    rows.forEach(({ who, e }) => {
      const tr = document.createElement("tr");
      const cell = (t, c) => { const td = document.createElement("td"); if (c) td.className = c; td.textContent = t; tr.appendChild(td); return td; };
      cell(e.date || "", "num"); cell(who); cell(e.title || "");
      cell(e.pages == null ? "–" : String(e.pages), "num"); cell(String(e.sessions ?? ""), "num");
      const p = cell(""); const sp = document.createElement("span");
      if (e.pages == null) { sp.className = "pass"; sp.style.color = "var(--muted)"; sp.textContent = "–"; }
      else { const ok = e.pages > 4; sp.className = "pass " + (ok ? "y" : "n"); sp.textContent = ok ? "통과" : "미통과"; }
      p.appendChild(sp);
      cell(e.disturbed === "yes" ? "네" : e.disturbed === "no" ? "아니요" : "–");
      cell(e.note || (e.answers && e.answers[0] ? e.answers[0].a : "") || "");
      tb.appendChild(tr);
    });
  }
  (async () => {
    if (!window.claude?.use) { localMode = true; $("store-note").textContent = "기록은 이 기기에만 저장돼요."; renderLocal(); return; }
    const [d, u] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("user").catch(() => null)]);
    db = d; user = u; try { myId = user ? await user.id() : null; } catch (e) {}
    if (!db) { localMode = true; $("store-note").textContent = "로그인 안 하면 기록은 이 기기에만 저장돼요."; renderLocal(); return; }
    let can = null; try { can = user ? await user.can("data.write") : null; } catch (e) {}
    if (!myId || can === false) localMode = true;
    $("store-note").textContent = localMode
      ? "다른 사람 기록은 볼 수 있지만, 내 기록은 이 기기에만 남아요. 공유하려면 링크 주인에게 ‘참여자’ 권한을 받으세요."
      : "내 기록은 모두가 볼 수 있는 이 표에 저장돼요.";
    db.collection("logs").onSnapshot(snap => {
      allDocs = snap.docs.map(s => ({ id: s.id, entries: (s.data() || {}).entries }));
      const mine = allDocs.find(x => x.id === myId); if (mine && Array.isArray(mine.entries)) myEntries = mine.entries.slice();
      if (localMode) { const loc = loadLocal(); if (loc.length) allDocs = allDocs.concat([{ id: "local", entries: loc }]); }
      renderShared();
    }, () => { $("store-note").textContent = "공유 기록을 못 불러왔어요. 새로고침해 주세요."; });
  })();

  // ---- 부팅 ----
  function boot() {
    renderDrawer();
    if (S.book) { $("book-tag").textContent = "『" + S.book + "』" + (S.author ? " · " + S.author : ""); $("pace-btn").hidden = false; $("reset-btn").hidden = false; $("pace-btn").textContent = S.interval + "분마다 말 걸기 · 바꾸기"; }
    renderChat();
    if (!S.greeted && !S.messages.length) {
      S.greeted = true; save();
      push("ai", "안녕하세요, 저는 완두예요 🌱\n끝까지 읽게 옆에서 도와드릴게요.\n오늘은 무슨 책 읽어요? 제목이랑 저자까지 알려주면 더 깊게 도와드려요.");
      mode("input", { ph: "예: 데미안 / 헤르만 헤세" });
      S.phase = "intro"; save(); return;
    }
    // 저장된 단계 복원
    if (S.phase === "reading") startReading(false);
    else if (S.phase === "ask_page") { mode("input", { ph: "숫자만 (예: 1)" }); showSkip("몰라요 · 건너뛰기", () => { push("me", "건너뛸게요"); S.startPage = null; save(); beginReading(); }); }
    else if (S.phase === "asking") mode("input", { ph: "한 줄로 답해 보세요" });
    else if (S.phase === "wrap_pages") { mode("input", { ph: S.startPage != null ? "숫자만 (예: " + (S.startPage + 8) + ")" : "숫자만 (예: 12)" }); showSkip("잘 모르겠어요", () => { push("me", "잘 모르겠어요"); S.pagesRead = null; save(); askDisturb(); }); }
    else if (S.phase === "wrap_disturb") askDisturb(true);
    else if (S.phase === "done") mode("chips", { items: [{ label: "새 책 읽기", solid: true, on: newBook }] });
    else if (S.phase === "intro") mode("input", { ph: "예: 데미안 / 헤르만 헤세" });
    else mode("input");
  }
  boot();
})();
</script>
